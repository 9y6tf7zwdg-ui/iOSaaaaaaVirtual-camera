name: Build Tweak

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos (RootHide Branch)
        run: |
          brew install ldid dpkg
          export THEOS=$HOME/theos
          # 关键：克隆 RootHide 专属的 Theos 分支
          git clone -b roothide --recursive https://github.com/roothide/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Build package
        run: |
          make clean || true
          make package FINALPACKAGE=1 THEOS_DEVICE_IP=127.0.0.1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: vcam-deb
          path: packages/*.deb